<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solar Observations from MastCam-Z</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f7f9; --surface: #ffffff; --ink: #1e2a36; --muted: #5b6876; --line: #d9dfe5;
  --mars: #b4532a; --mars-soft: #f3e3da; --earth: #2f6db5; --earth-soft: #dfe9f5;
  --mat: #ffffff; --focus: #2f6db5;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a23; --surface: #182330; --ink: #e6ebf0; --muted: #9aa8b6; --line: #2a3846;
    --mars: #e0875c; --mars-soft: #3a2a23; --earth: #7aa9e3; --earth-soft: #1f3147;
    --mat: #f4f6f8; --focus: #7aa9e3; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a23; --surface: #182330; --ink: #e6ebf0; --muted: #9aa8b6; --line: #2a3846;
  --mars: #e0875c; --mars-soft: #3a2a23; --earth: #7aa9e3; --earth-soft: #1f3147;
  --mat: #f4f6f8; --focus: #7aa9e3; color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--sans); }
a { color: var(--earth); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
header.top { padding: 44px 0 20px; }
h1 { font: 600 clamp(2rem, 5vw, 3.4rem)/1.02 var(--cond); letter-spacing: -0.01em; margin: 0 0 12px; }
.lede { max-width: 68ch; margin: 0; color: var(--muted); font-size: 1.05rem; }
.lede .m { color: var(--mars); font-weight: 600; }
.lede .e { color: var(--earth); font-weight: 600; }

/* campaign timeline: the one bold element */
.timeline { margin: 28px 0 8px; }
.timeline .rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(44px, 1fr); gap: 4px;
  overflow-x: auto; padding-bottom: 6px; }
.day { border: 0; background: var(--surface); color: var(--muted); border-radius: 6px; padding: 8px 4px 10px;
  font: 500 0.95rem/1 var(--cond); cursor: default; display: flex; flex-direction: column; align-items: center;
  gap: 7px; min-height: 64px; border-bottom: 3px solid transparent; }
.day.has { color: var(--ink); cursor: pointer; }
.day.has:hover { background: var(--mars-soft); }
.day.sel { background: var(--ink); color: var(--bg); border-bottom-color: var(--mars); }
.day .dots { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; max-width: 34px; }
.day .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mars); }
.day .ring { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--mars); }
.day.sel .dot { background: var(--mars-soft); }
.day.sel .ring { border-color: var(--mars-soft); }
.day .none { width: 10px; height: 2px; background: var(--line); border-radius: 1px; margin-top: 2px; }
.timeline .key { font-size: 0.85rem; color: var(--muted); margin: 6px 0 0; }
.timeline .key .dot, .timeline .key .ring { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  margin: 0 4px 1px 0; vertical-align: middle; }
.timeline .key .dot { background: var(--mars); }
.timeline .key .ring { border: 1.5px solid var(--mars); margin-left: 12px; }

/* observation */
section.obs { margin: 26px 0 0; }
.obs-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.obs-head h2 { font: 600 1.7rem/1.1 var(--cond); margin: 0; flex: 1 1 auto; }
.obs-head h2 small { font: 400 1rem var(--sans); color: var(--muted); margin-left: 8px; }
.nav { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px;
  font: 500 0.95rem var(--sans); padding: 7px 12px; cursor: pointer; }
.nav:disabled { opacity: 0.4; cursor: default; }
select.pick { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px;
  font: 400 0.95rem var(--sans); padding: 7px 8px; max-width: 100%; }
dl.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; margin: 16px 0 0;
  background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
dl.facts div { background: var(--surface); padding: 10px 14px; }
dl.facts dt { font-size: 0.82rem; color: var(--muted); }
dl.facts dd { margin: 2px 0 0; font: 500 1.15rem var(--cond); }
dd.m { color: var(--mars); } dd.e { color: var(--earth); }
.cam { margin: 26px 0 0; }
.cam h3, .geo h3 { font: 600 1.25rem var(--cond); margin: 0 0 8px; }
.cam h3 span { font: 400 0.9rem var(--sans); color: var(--muted); margin-left: 8px; }
figure { margin: 0; }
.geo { margin: 26px 0 0; }
p.caption { font-size: 0.9rem; color: var(--muted); margin: 10px 0 0; max-width: 85ch; }
figure .mat { background: var(--mat); border-radius: 8px; padding: 10px; border: 1px solid var(--line); }
figure img { display: block; width: 100%; height: auto; cursor: zoom-in; }
figcaption { font-size: 0.9rem; color: var(--muted); margin-top: 8px; max-width: 80ch; }
.missing { padding: 40px; text-align: center; color: #5b6876; }
.summary { margin: 22px 0 0; }
.summary-bar { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.summary-bar h3 { font: 600 1.25rem var(--cond); margin: 0; flex: 1 1 auto; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px;
  font: 500 0.9rem var(--sans); padding: 6px 12px; cursor: pointer; text-decoration: none; }
pre.txt { margin: 10px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 16px 18px; overflow-x: auto; font: 400 0.82rem/1.5 var(--mono); color: var(--ink); white-space: pre; }

/* campaign table */
section.campaign { margin: 48px 0 0; }
section.campaign h2, section.notes h2, section.source h2 { font: 600 1.6rem/1.1 var(--cond); margin: 0 0 6px; }
section.campaign h3 { font: 600 1.2rem var(--cond); margin: 22px 0 8px; }
section.source { margin: 48px 0 0; max-width: 78ch; }
section.regions { margin: 48px 0 0; }
section.regions h2 { font: 600 1.6rem/1.1 var(--cond); margin: 0 0 6px; }
.region-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 12px; }
.region-bar label { font-size: 0.9rem; color: var(--muted); }
#region-text { max-width: 85ch; margin: 0 0 12px; }
.campaign p { max-width: 75ch; color: var(--muted); margin: 0 0 14px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { padding: 8px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font: 500 0.82rem var(--sans); color: var(--muted); background: var(--surface); }
th:first-child, td:first-child { text-align: left; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--mars-soft); }
tbody tr.sel { background: var(--earth-soft); }
td.m { color: var(--mars); font-weight: 500; } td.e { color: var(--earth); font-weight: 500; }
tfoot td { font-weight: 600; border-bottom: 0; }

section.notes { margin: 48px 0 0; max-width: 78ch; }
.notes p, .notes li { color: var(--ink); }
.notes code { font: 0.9em var(--mono); }
footer { margin: 56px 0 0; padding: 22px 0 40px; border-top: 1px solid var(--line); color: var(--muted);
  font-size: 0.88rem; }

/* full-size view */
.lightbox { position: fixed; inset: 0; background: rgba(10, 16, 22, 0.88); display: none; z-index: 20;
  align-items: center; justify-content: center; padding: 20px; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 100%; background: #fff; border-radius: 6px; }
.lightbox button { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 14px; }
@media (prefers-reduced-motion: no-preference) {
  .day, .nav, .btn, tbody tr { transition: background-color 120ms ease; }
}
@media (max-width: 640px) {
  header.top { padding-top: 28px; }
  pre.txt { font-size: 0.74rem; }
}
</style>
<script src="data.js"></script>
</head>
<body>
<header class="top wrap">
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <div class="timeline" aria-label="Observation dates">
    <div class="rail" id="rail" role="list"></div>
    <p class="key" id="key"></p>
  </div>
</header>

<main class="wrap">
  <section class="obs" id="obs" aria-live="polite">
    <div class="obs-head">
      <button class="nav" id="prev" aria-label="Previous observation">‹ Previous</button>
      <h2 id="obs-title"></h2>
      <select class="pick" id="pick" aria-label="Choose an observation"></select>
      <button class="nav" id="next" aria-label="Next observation">Next ›</button>
    </div>
    <dl class="facts" id="facts"></dl>
    <div id="cams"></div>
    <p class="caption" id="cam-caption"></p>
    <div class="geo">
      <h3 id="geo-title"></h3>
      <figure><div class="mat" id="fig-geometry"></div></figure>
      <p class="caption" id="geo-caption"></p>
    </div>
    <div id="summaries"></div>
  </section>

  <section class="campaign" id="campaign">
    <h2 id="tables-title"></h2>
    <p id="campaign-text"></p>
    <div id="tables"></div>
  </section>

  <section class="regions" id="regions" hidden>
    <h2 id="regions-title"></h2>
    <div class="region-bar">
      <label for="region-pick">Show</label>
      <select class="pick" id="region-pick"></select>
    </div>
    <p id="region-text"></p>
    <figure><div class="mat" id="fig-region"></div></figure>
    <p class="caption" id="region-caption"></p>
  </section>

  <section class="notes" id="notes">
    <h2 id="notes-title"></h2>
    <div id="notes-body"></div>
  </section>

  <section class="source" id="source" hidden>
    <h2>Reference and contact</h2>
    <p id="source-text"></p>
  </section>
</main>

<footer class="wrap" id="foot-note"></footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Full-size figure">
  <button class="btn" id="close">Close</button>
  <img id="lightbox-img" alt="">
</div>

<script>
(function () {
  const S = window.SITE, O = S.slots, C = S.campaign;
  const EYES = ['R', 'L'].filter((e) => C.eyes[e]);
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
  const fmt = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v)) ? '—' : Number(v).toFixed(d);
  const sign = (v) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + '°';
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const longDate = (s) => { const [y, m, d] = s.split('-').map(Number); return d + ' ' + months[m - 1] + ' ' + y; };
  const short = (e) => (e === 'R' ? 'Right' : 'Left');

  document.title = S.title;
  $('title').textContent = S.title;
  $('lede').innerHTML = S.subtitle.replace('Mastcam-Z', '<span class="m">Mastcam-Z</span>')
    .replace('SDO/HMI', '<span class="e">SDO/HMI</span>') + '.';
  const TX = S.text;
  $('cam-caption').innerHTML = TX.figure_caption;
  $('geo-title').innerHTML = TX.geometry_title;
  $('geo-caption').innerHTML = TX.geometry_caption;
  $('tables-title').innerHTML = TX.tables_title;
  $('notes-title').innerHTML = TX.notes_title;
  TX.notes.forEach((t) => { const p = el('p'); p.innerHTML = t; $('notes-body').appendChild(p); });
  $('key').innerHTML = (C.eyes.R ? '<span class="dot"></span>right-camera detection' + (C.eyes.L ? ', ' : '') : '') +
    (C.eyes.L ? '<span class="ring"></span>left-camera detection' : '') + '; dashed days have no observation';

  // ---- timeline -------------------------------------------------------------------
  const byDay = {};
  O.forEach((o, i) => { (byDay[o.date] = byDay[o.date] || []).push(i); });
  const d0 = new Date(C.start + 'T00:00:00Z'), d1 = new Date(C.end + 'T00:00:00Z');
  for (let t = d0; t <= d1; t = new Date(t.getTime() + 86400000)) {
    const key = t.toISOString().slice(0, 10);
    const idx = byDay[key] || [];
    const b = el('button', 'day' + (idx.length ? ' has' : ''));
    b.setAttribute('role', 'listitem');
    b.dataset.day = key;
    b.appendChild(el('span', '', String(t.getUTCDate()).padStart(2, '0')));
    if (idx.length) {
      const count = (e) => Math.max(0, ...idx.map((i) => (O[i].eyes[e] ? O[i].eyes[e].n_det : 0)));
      const nR = count('R'), nL = count('L');
      const dots = el('span', 'dots');
      for (let k = 0; k < Math.min(nR, 6); k++) dots.appendChild(el('span', 'dot'));
      for (let k = 0; k < Math.min(nL, 6); k++) dots.appendChild(el('span', 'ring'));
      b.appendChild(dots);
      b.setAttribute('aria-label', longDate(key) + ': right camera ' + nR + ', left camera ' + nL + ' detections');
      b.addEventListener('click', () => select(idx[0]));
    } else {
      b.appendChild(el('span', 'none'));
      b.disabled = true; b.setAttribute('aria-label', longDate(key) + ': no observation');
    }
    $('rail').appendChild(b);
  }

  // ---- picker and tables (one per camera) ------------------------------------------------
  O.forEach((o, i) => {
    const op = el('option', '', o.date + ' ' + o.time + ' UTC' + (o.sol !== null ? ', sol ' + o.sol : ''));
    op.value = i; $('pick').appendChild(op);
  });
  const rowsOf = {};
  EYES.forEach((e) => {
    const info = C.eyes[e];
    $('tables').appendChild(el('h3', '', info.label));
    const wrap = el('div', 'tablewrap'); const table = el('table');
    table.innerHTML = '<thead><tr><th scope="col">Date and time (UTC)</th><th scope="col">Sol</th>' +
      '<th scope="col">Mars–Earth separation</th><th scope="col">Mastcam-Z detections</th>' +
      '<th scope="col">HMI detections</th><th scope="col">Of these seen</th>' +
      '<th scope="col">Mastcam-Z / HMI umbra</th></tr></thead>';
    const tb = el('tbody'); rowsOf[e] = [];
    O.forEach((o, i) => {
      const c = o.eyes[e]; if (!c) return;
      const tr = el('tr'); tr.tabIndex = 0; tr.dataset.slot = i;
      tr.innerHTML = '<td>' + o.date + ' ' + c.time.slice(0, 5) + '</td><td>' + (o.sol ?? '—') + '</td><td>' + sign(o.sep) + '</td>' +
        '<td class="m">' + c.n_det + '</td><td class="e">' + c.n_groups_zone + '</td><td>' + c.n_seen + '</td>' +
        '<td>' + fmt(c.r_umbra) + '</td>';
      tr.addEventListener('click', () => { select(i); $('obs').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); });
      tr.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') tr.click(); });
      tb.appendChild(tr); rowsOf[e].push(tr);
    });
    table.appendChild(tb);
    const tf = el('tfoot');
    tf.innerHTML = '<tr><td>Median of ' + info.n_pairs + ' matched spots</td><td></td><td></td><td></td><td></td><td></td><td>' + fmt(info.r_umbra) + '</td></tr>';
    table.appendChild(tf); wrap.appendChild(table); $('tables').appendChild(wrap);
  });
  $('campaign-text').textContent = 'One table per camera. HMI detections are the HMI sunspot groups inside the evaluation zone; ' +
    'the last column is the median ratio of the Mastcam-Z umbral area to the HMI umbral area for the matched spots ' +
    '(1 means Mastcam-Z reproduces HMI). Select a row to show that observation.';

  // ---- one observation ------------------------------------------------------------------
  function figure(box, src, alt) {
    box.innerHTML = '';
    if (!src) { box.appendChild(el('p', 'missing', 'Figure not available for this observation.')); return; }
    const img = el('img'); img.src = src; img.alt = alt; img.loading = 'lazy';
    img.addEventListener('click', () => { $('lightbox-img').src = src; $('lightbox-img').alt = alt; $('lightbox').classList.add('open'); $('close').focus(); });
    box.appendChild(img);
  }
  let cur = -1, blobs = [];
  function select(i) {
    if (i < 0 || i >= O.length) return;
    cur = i; const o = O[i];
    $('obs-title').innerHTML = longDate(o.date) + '<small>' + o.time + ' UTC' + (o.sol !== null ? ', sol ' + o.sol : '') + '</small>';
    $('pick').value = i;
    $('prev').disabled = i === 0; $('next').disabled = i === O.length - 1;
    const facts = [];
    EYES.forEach((e) => {
      const c = o.eyes[e];
      facts.push([short(e) + ' camera', c ? c.n_det + ' detection' + (c.n_det === 1 ? '' : 's') + ', ' + c.n_seen + ' of ' + c.n_groups_zone + ' HMI groups seen' : 'no image', 'm']);
    });
    facts.push(['Mastcam-Z / HMI umbra', EYES.map((e) => short(e).toLowerCase() + ' ' + (o.eyes[e] ? fmt(o.eyes[e].r_umbra) : '—')).join(', '), '']);
    facts.push(['Mars–Earth separation', sign(o.sep), '']);
    facts.push(['HMI image', o.hmi.replace('T', ' ').slice(0, 16) + ' UTC', 'e']);
    $('facts').innerHTML = facts.map(([k, v, c]) => '<div><dt>' + k + '</dt><dd class="' + c + '">' + v + '</dd></div>').join('');

    blobs.forEach((b) => URL.revokeObjectURL(b)); blobs = [];
    $('cams').innerHTML = ''; $('summaries').innerHTML = '';
    EYES.forEach((e) => {
      const c = o.eyes[e]; if (!c) return;
      const cam = el('div', 'cam');
      const h = el('h3', '', c.label); h.appendChild(el('span', '', c.time + ' UTC, noise ' + (c.noise * 100).toFixed(2) + ' % per pixel'));
      cam.appendChild(h);
      const fig = el('figure'); const mat = el('div', 'mat'); fig.appendChild(mat); cam.appendChild(fig);
      figure(mat, c.overview, c.label + ': Mastcam-Z image, detection significance and reprojected HMI image for ' + o.utc);
      $('cams').appendChild(cam);

      const sum = el('div', 'summary'); const bar = el('div', 'summary-bar');
      bar.appendChild(el('h3', '', 'Summary, ' + c.label.charAt(0).toLowerCase() + c.label.slice(1)));
      const copy = el('button', 'btn', 'Copy text');
      copy.addEventListener('click', () => {
        const done = () => { copy.textContent = 'Copied'; setTimeout(() => { copy.textContent = 'Copy text'; }, 1500); };
        try { navigator.clipboard.writeText(c.summary).then(done, () => {}); } catch (err) { /* clipboard not available */ }
      });
      const dl = el('a', 'btn', 'Download summary.txt');
      if (c.summary_file) { dl.href = c.summary_file; }
      else { const u = URL.createObjectURL(new Blob([c.summary + '\n'], { type: 'text/plain' })); blobs.push(u); dl.href = u; }
      dl.setAttribute('download', c.stem + '_summary.txt');
      bar.appendChild(copy); bar.appendChild(dl); sum.appendChild(bar);
      sum.appendChild(el('pre', 'txt', c.summary));
      $('summaries').appendChild(sum);
    });
    figure($('fig-geometry'), o.geometry, 'Positions of Mars and Earth and the visible solar hemispheres for ' + o.utc);
    document.querySelectorAll('.day').forEach((b) => b.classList.toggle('sel', b.dataset.day === o.date));
    EYES.forEach((e) => rowsOf[e].forEach((tr) => tr.classList.toggle('sel', Number(tr.dataset.slot) === i)));
    if (location.hash.slice(1) !== o.key) history.replaceState(null, '', '#' + o.key);
  }
  $('prev').addEventListener('click', () => select(cur - 1));
  $('next').addEventListener('click', () => select(cur + 1));
  $('pick').addEventListener('change', (e) => select(Number(e.target.value)));
  document.addEventListener('keydown', (e) => {
    if ($('lightbox').classList.contains('open')) { if (e.key === 'Escape') $('close').click(); return; }
    if (e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowLeft') select(cur - 1);
    if (e.key === 'ArrowRight') select(cur + 1);
  });
  $('close').addEventListener('click', () => $('lightbox').classList.remove('open'));
  $('lightbox').addEventListener('click', (e) => { if (e.target === $('lightbox')) $('close').click(); });
  function fromHash() {
    const k = location.hash.slice(1);
    const i = O.findIndex((o) => o.key === k);
    return i >= 0 ? i : 0;
  }
  window.addEventListener('hashchange', () => select(fromHash()));

  // ---- reference, contact, footer ------------------------------------------------------------
  if (S.reference || S.contact) {
    const p = $('source-text');
    if (S.reference) {
      p.appendChild(document.createTextNode('Reference: '));
      const a = el('a', '', S.reference.label); a.href = S.reference.url; a.rel = 'noopener'; a.target = '_blank';
      p.appendChild(a); p.appendChild(document.createTextNode('. '));
    }
    if (S.contact) {
      p.appendChild(document.createTextNode('For more details or support, contact ' + (S.contact.name || '')));
      if (S.contact.email) {
        p.appendChild(document.createTextNode(S.contact.name ? ' (' : ''));
        const m = el('a', '', S.contact.email); m.href = 'mailto:' + S.contact.email; p.appendChild(m);
        p.appendChild(document.createTextNode(S.contact.name ? ').' : '.'));
      } else { p.appendChild(document.createTextNode('.')); }
    }
    $('source').hidden = false;
  }
  $('foot-note').textContent = (S.author ? S.author + '. ' : '') + 'Generated ' + S.generated +
    '. Mastcam-Z data: NASA Mars 2020, Mastcam-Z team (PDS). SDO/HMI data: NASA SDO and the HMI science team (JSOC).';
  if (S.repo_url) { const a = el('a', '', ' Analysis code.'); a.href = S.repo_url; $('foot-note').appendChild(a); }

  // ---- sunspot regions across the disk ----------------------------------------------------------
  if (S.tracks && S.tracks.overview && $('regions')) {
    const TXT = S.text || {};
    const opts = [{ label: 'All regions', figure: S.tracks.overview, text: S.tracks.overview_text, all: true }]
      .concat(S.tracks.regions || []);
    opts.forEach((r, i) => { const op = el('option', '', r.label); op.value = i; $('region-pick').appendChild(op); });
    $('regions-title').textContent = TXT.regions_title || 'Sunspot regions across the disk';
    const showRegion = (i) => {
      const r = opts[i];
      figure($('fig-region'), r.figure, (r.all ? 'All sunspot regions' : r.label) + ' followed across the solar disk');
      $('region-text').textContent = r.text || '';
      $('region-caption').innerHTML = (r.all ? TXT.regions_caption_all : TXT.regions_caption_one) ||
        (r.all ? 'All regions: crossing the disk, umbral area, area ratio against μ, and position offsets.'
               : 'The region crossing the disk, its latitude, its umbral area, and the area ratio against μ.');
    };
    $('region-pick').addEventListener('change', (ev) => showRegion(Number(ev.target.value)));
    showRegion(0);
    $('regions').hidden = false;
  }
  select(fromHash());
})();
</script>
</body>
</html>
